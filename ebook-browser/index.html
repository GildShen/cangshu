<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藏書 | EPUB 閱讀器</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="identity"><button id="home" title="返回書庫" aria-label="返回書庫"><i data-lucide="library"></i></button><strong>藏書</strong><span id="book-title"></span></div><div class="header-import"><div class="import-options"><label for="import-mode">匯入方式</label><select id="import-mode"><option value="web">匯入並轉成網頁版</option><option value="epub">只匯入 EPUB</option></select></div><label class="command"><i data-lucide="plus"></i>匯入 EPUB<input id="files" type="file" accept=".epub,application/epub+zip" multiple hidden></label></div></header>
<div id="status" role="status" aria-live="polite"></div>
<link rel="stylesheet" href="compact-toolbar.css">
<main id="library"><div class="library-head"><h1>我的書庫 <small id="total"></small></h1><div class="filters"><input id="search" type="search" placeholder="搜尋書名或作者" aria-label="搜尋書名或作者"><select id="sort" aria-label="排序"><option value="recent">最近閱讀</option><option value="title">書名</option><option value="added">最近匯入</option></select></div></div><div id="shelf"></div><p id="empty" hidden>書庫中沒有符合的書籍</p></main>
<section id="reader" hidden><div class="reader-tools"><button id="toc-toggle" title="開關目錄" aria-label="開關目錄" aria-expanded="true"><i data-lucide="panel-left"></i></button><label>字級 <input id="size" type="range" min="16" max="36" value="22"><output id="size-value">22</output></label><select id="font" aria-label="字體"><option value="serif">宋體</option><option value="sans-serif">黑體</option><option value="original">原書字體</option></select><select id="spacing" aria-label="行距"><option value="1.8">標準行距</option><option value="2.1">寬鬆行距</option><option value="1.5">緊湊行距</option></select><button id="theme" title="切換日夜模式" aria-label="切換日夜模式" aria-pressed="false"><i data-lucide="moon"></i></button></div><div class="reading-body"><aside id="outline"><div class="toc-label">章節目錄</div><nav id="toc"></nav></aside><div id="viewport"></div></div><footer><button id="prev" title="上一頁" aria-label="上一頁"><i data-lucide="chevron-left"></i></button><span id="chapter"></span><span id="position"></span><button id="next" title="下一頁" aria-label="下一頁"><i data-lucide="chevron-right"></i></button></footer></section>
<dialog id="picture"><form method="dialog"><button title="關閉" aria-label="關閉"><i data-lucide="x"></i></button></form><img alt="書中圖片放大"></dialog>
<dialog id="note"><form method="dialog"><button>關閉</button></form><p></p></dialog>
<link rel="stylesheet" href="vendor/pdf/pdf_viewer.css"><link rel="stylesheet" href="pdf-reader.css"><style>#toc .pdf-thumbnail{height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-bottom:1px solid var(--line)}.pdf-thumbnail canvas{max-width:130px;max-height:165px;object-fit:contain}</style><script src="vendor/pdf/pdf-bundle.js"></script><script src="pdf-reader.js"></script>
<script src="vendor/jszip.min.js"></script><script src="vendor/epub.min.js"></script><script src="vendor/lucide.min.js"></script><script src="vendor/purify.min.js"></script><script src="storage.js"></script><script src="converter.js"></script><script src="web-reader.js"></script><script src="export.js"></script><script src="app.js"></script><script src="library-extras.js"></script><script src="highlights.js"></script><script src="ai-reader.js"></script><link rel="stylesheet" href="ui-polish.css"><script src="ui-polish.js"></script></body></html>
